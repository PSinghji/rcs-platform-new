<!DOCTYPE html>
<html lang="en" data-theme="default">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title if title else "RCS Hub" }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        /* Paste the <style> content from admin_base.html here */
        /* OR create a static/css/style.css and link it in both files */
    </style>
</head>
<body class="bg-light">
    
    <nav class="navbar navbar-expand-lg sticky-top" style="background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); border-bottom: 1px solid #e2e8f0;">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="#">
                <div class="bg-primary text-white rounded p-1 d-flex"><i class="bi bi-lightning-fill"></i></div>
                <span style="letter-spacing: -0.5px;">RCS Hub</span>
            </a>
            
            <div class="d-flex align-items-center gap-3">
                {% if user %}
                    <span class="badge bg-white text-dark border shadow-sm px-3 py-2 rounded-pill">
                         {{ "{:,.0f}".format(user.wallet_balance|default(0)) }}
                    </span>
                    <button class="btn btn-dark btn-sm rounded-pill px-3" onclick="logout()">Logout</button>
                {% else %}
                    <a href="/auth/login" class="btn btn-primary btn-sm rounded-pill px-4">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container-fluid p-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function logout() {
            await fetch('/auth/logout', { method: 'POST' });
            window.location.href = '/auth/login';
        }
    </script>
</body>
</html>
