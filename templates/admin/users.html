{% extends "layout/admin_base.html" %}

{% block content %}
<h4 class="mb-4">Users</h4>

<div class="card shadow-sm">
    <div class="card-body">

        <table class="table table-bordered table-hover">
            <thead class="table-light">
            <tr>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
            </tr>
            </thead>
            <tbody>
            {% for u in users %}
            <tr>
                <td>{{ u.email }}</td>
                <td>{{ u.role }}</td>
                <td>{{ u.status or 'active' }}</td>
            </tr>
            {% endfor %}
            </tbody>
        </table>

    </div>
</div>
{% endblock %}
